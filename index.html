<!DOCTYPE html>
<html>

<head>
  <title>MINT</title>
  <script src="https://unpkg.com/jspsych@8.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
  <!-- A custom plugin that adds a green box around the button when it's clicked -->
  <script src="script/jspsych/plugin-html-button-response-green-box.js"></script>
  <!-- A custom plugin that ends the trial when the audio is finished playing -->
  <script src="script/jspsych/plugin-html-end-trial-on-audio-finish.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-image-button-response@2.0.0"></script>
  <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
  <link href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" rel="stylesheet" type="text/css" />
</head>

<body></body>
<!-- always init JsPsych first -->
<script src="script/init.js"></script>

<!-- load utils -->
<script src="script/utils/media.js"></script>
<script src="script/utils/stimulus.js"></script>
<script src="script/utils/time.js"></script>

<!-- load trials -->
<script src="script/instruction_trial.js"></script>
<script src="script/semantic_training_trial.js"></script>
<script src="script/forced_choice_test_trial.js"></script>
<script src="script/touch_box_trial.js"></script>

<!-- load procedures -->
<script src="script/procedures/introduction.js"></script>
<script src="script/procedures/semantic_training.js"></script>
<script src="script/procedures/forced_choice_test.js"></script>
<script src="script/procedures/touch_box.js"></script>

<!-- construct experiment -->
<script>
 
let subjectID = "";

var instructions = {
    type: jsPsychHtmlButtonResponse,

    stimulus: `
        <p>Welcome to the experiment!</p>
        <p>Subject ID:</p>
        <input type="text" id="subject-id"
               placeholder="Enter Subject ID"
               autocomplete="off"
               style="font-size: 20px; padding: 8px;">
    `,

    choices: ["Begin"],

    on_load: function() {
        const input = document.getElementById("subject-id");
        const button = document.querySelector(
            "#jspsych-html-button-response-btngroup button"
        );

        // Require a subject ID before proceeding
        button.disabled = true;

        input.addEventListener("input", function() {
            subjectID = input.value.trim();
            button.disabled = subjectID.length === 0;
        });
    },

    on_finish: function(data) {
        data.subject_id = subjectID;

        // Add subject ID to all trial data
        jsPsych.data.addProperties({
            subject_id: subjectID
        });
    }
};

  
const jsPsych = initJsPsych({
extensions: [
    {
      type: jsPsychExtensionPipe,
      params: {
        experiment_id: "ainm24f0q9xl",
        filename: () => `${subject_id}.csv`
      }
    }
  ]
});


//
// PRELOAD IMAGES AND AUDIO
//

// All procedures used in the experiment
const preloadProcedures = [

    // Introduction
    instruction_introduction_procedure,

    // Touch-box trials
    touch_box_procedure1,
    touch_box_procedure2,
    touch_box_procedure3,
    touch_box_procedure4,
    touch_box_procedure5,
    touch_box_procedure6,

    // Semantic training trials
    semantic_training_procedure1,
    semantic_training_procedure2,
    semantic_training_procedure3,
    semantic_training_procedure4,
    semantic_training_procedure5,
    semantic_training_procedure6,
    semantic_training_procedure7,
    semantic_training_procedure8,
    semantic_training_procedure9,
    semantic_training_procedure10,
    semantic_training_procedure11,
    semantic_training_procedure12,

    // Repetition instructions
    instruction_repetition_procedure,

    // Test instructions
    instruction_test_procedure,
    instruction_test_real_procedure,
    instruction_test_halfway_procedure,

    // Familiarization test
    forced_choice_test_familiar_procedure,

    // Main test
    forced_choice_test_procedure1,
    forced_choice_test_procedure2,

    // Ending
    instruction_end_procedure
];

// Collect timeline variables from all procedures
const preloadItems = preloadProcedures.flatMap(
    procedure => procedure.timeline_variables || []
);

// Add folder prefix only if the path doesn't have one
function preloadPath(folder, filename) {
    if (typeof filename !== 'string' || !filename) {
        return null;
    }

    return filename.includes('/')
        ? filename
        : `${folder}/${filename}`;
}

// Build the preload trial
var preload = {
    type: jsPsychPreload,

    // Explicitly list files because many are embedded in HTML
    auto_preload: false,

    images: [
        ...new Set([
            // Backgrounds specified directly in trial code
            'image/training_background.png',
            'image/test_background.png',

            // Images specified in procedure variables
            ...preloadItems.flatMap(item => [
                item.image,
                item.left,
                item.right
            ])
            .map(file => preloadPath('image', file))
            .filter(Boolean)
        ])
    ],

    audio: [
        ...new Set(
            preloadItems
                .map(item => preloadPath('wav', item.audio))
                .filter(Boolean)
        )
    ],

    // Stop experiment if a required file fails to load
    continue_after_error: false
};


const subject_id = jsPsych.randomization.randomID(10);
const timeline = [];
// ...add your trials to the timeline...
timeline.push(preload);
timeline.push(instructions);
timeline.push(instruction_introduction_procedure);
timeline.push(touch_box_procedure1);
timeline.push(semantic_training_procedure1);
timeline.push(touch_box_procedure2);
timeline.push(semantic_training_procedure2);
timeline.push(touch_box_procedure3);
timeline.push(semantic_training_procedure3);
timeline.push(touch_box_procedure4);
timeline.push(semantic_training_procedure4);
timeline.push(touch_box_procedure5);
timeline.push(semantic_training_procedure5);
timeline.push(touch_box_procedure6);
timeline.push(semantic_training_procedure6);
timeline.push(instruction_repetition_procedure);
timeline.push(touch_box_procedure1);
timeline.push(semantic_training_procedure7);
timeline.push(touch_box_procedure2);
timeline.push(semantic_training_procedure8);
timeline.push(touch_box_procedure3);
timeline.push(semantic_training_procedure9);
timeline.push(touch_box_procedure4);
timeline.push(semantic_training_procedure10);
timeline.push(touch_box_procedure5);
timeline.push(semantic_training_procedure11);
timeline.push(touch_box_procedure6);
timeline.push(semantic_training_procedure12);
timeline.push(instruction_test_procedure);
timeline.push(forced_choice_test_familiar_procedure);
timeline.push(instruction_test_real_procedure);
timeline.push(forced_choice_test_procedure1);
timeline.push(instruction_test_halfway_procedure);
timeline.push(forced_choice_test_procedure2);
timeline.push(instruction_end_procedure);

jsPsych.run(timeline);


</script>

</html>
